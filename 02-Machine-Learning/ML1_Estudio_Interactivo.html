body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(124,109,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,109,235,.05) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; }
.wrap { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:24px 18px 40px; }
header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.tag { font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; }
<script>
// Minimal safe initializer: empty quiz and two flashcards so the page JS runs.
const QUIZ = [];
const FLASHCARDS = [
  { front: 'Visión general', back: 'Breve introducción a Machine Learning.' },
  { front: 'Tipos', back: 'Supervisado, No supervisado, Semi-supervisado, Refuerzo.' }
];

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function renderStats(){document.getElementById('totalQ').textContent = QUIZ.length; document.getElementById('correctQ').textContent = '0'; document.getElementById('wrongQ').textContent = '0'; document.getElementById('remainQ').textContent = '0'; document.getElementById('progressFill').style.width = '0%';}

function renderCurrentQuestion(){ const host = document.getElementById('questionHost'); host.innerHTML = `<div class="card"><div class="q">No hay preguntas para estos filtros.</div><div style="color:var(--muted)">Genera o carga preguntas para comenzar el quiz.</div></div>`; document.getElementById('nextBtn').classList.add('hidden'); }

let cardIndex = 0, cardBack=false;
function renderFlashcard(){ const c = FLASHCARDS[cardIndex%FLASHCARDS.length]; document.getElementById('flashText').textContent = c.front; document.getElementById('flipInfo').textContent = `${(cardIndex%FLASHCARDS.length)+1} / ${FLASHCARDS.length}`; }
function flipFlashcard(){ cardBack=!cardBack; const c=FLASHCARDS[cardIndex%FLASHCARDS.length]; document.getElementById('flashText').textContent = cardBack?c.back:c.front; }
function nextCard(){ cardIndex=(cardIndex+1)%FLASHCARDS.length; renderFlashcard(); }
function prevCard(){ cardIndex=(cardIndex-1+FLASHCARDS.length)%FLASHCARDS.length; renderFlashcard(); }

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click', ()=>{ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }));
document.getElementById('skipBtn').addEventListener('click', ()=>{});
document.getElementById('shuffleBtn').addEventListener('click', ()=>{});
document.getElementById('nextBtn').addEventListener('click', ()=>{});
document.getElementById('restartBtn').addEventListener('click', ()=>{ renderCurrentQuestion(); renderStats(); });
document.getElementById('flashcard').addEventListener('click', flipFlashcard);
document.getElementById('prevCardBtn').addEventListener('click', prevCard);
document.getElementById('nextCardBtn').addEventListener('click', nextCard);
document.getElementById('searchBox').addEventListener('input', ()=>{});

renderCurrentQuestion(); renderFlashcard(); renderStats();
</script>

const FLASHCARDS = [
  { front: 'Visión general', back: 'Breve introducción a Machine Learning: teoría y práctica con Python.' },
  { front: 'Tipos de aprendizaje', back: 'Supervisado, No supervisado, Semi-supervisado y Por refuerzo.' }
];

const units = ['all','U1','U2','U3','U4'];
const sessionsByUnit = {
  all: ['all'],
  U1: ['all','T1S1','T1S2','T2S3','T2S4'],
  U2: ['all','U2T1','U2T2','T1S1','T1S2','T2S3','T2S4'],
  U3: ['all','T1S1','T1S2','T2S3','T2S4'],
  U4: ['all','T1S1','T1S2','T2S3','T2S4'],
};

let mode = 'quiz';
let unitFilter = 'all';
let sessionFilter = 'all';
let searchFilter = '';
let currentQuestions = [];
let currentIndex = 0;
let answered = false;
let correct = 0;
let wrong = 0;
let cardIndex = 0;
let cardFlipped = false;

const unitLabels = { all:'Todas las unidades', U1:'Unidad 1', U2:'Unidad 2', U3:'Unidad 3', U4:'Unidad 4' };
const sessionLabels = { all:'Todas las sesiones', T1S1:'T1·S1', T1S2:'T1·S2', T2S3:'T2·S3', T2S4:'T2·S4', U2T1:'U2·T1', U2T2:'U2·T2' };

function parseSource(src) {
  const m = src.match(/Unidad(\d+).*Tema(\d+)-Semana(\d+)/);
  if (!m) return { unit:'all', session:'all', label: src || 'notas.md' };
  return { unit:`U${m[1]}`, session:`T${m[2]}S${m[3]}`, label:`U${m[1]} T${m[2]} S${m[3]}` };
}

const questions = QUIZ.map((q, idx) => {
  const src = parseSource(q.src || '');
  return {
    id: idx + 1,
    unit: q.u || src.unit,
    session: q.s || src.session,
    label: src.label,
    source: q.src || '',
    topic: q.src || '',
    q: q.q,
    o: q.o,
    c: q.c,
    e: q.e || '',
  };
});

function unique(arr) { return [...new Set(arr)]; }
function bySourceLabel(q) { return q.label || q.source || 'notas.md'; }
function bySession(q) { return q.session || 'all'; }
function byUnit(q) { return q.unit || 'all'; }
function shuf(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function filteredQuestions() {
  const term = searchFilter.trim().toLowerCase();
  return questions.filter(q => {
    const unitOk = unitFilter === 'all' || byUnit(q) === unitFilter;
    const sessionOk = sessionFilter === 'all' || bySession(q) === sessionFilter;
    const searchOk = !term || [q.q, q.source, q.label, q.topic, q.o.join(' ')].join(' ').toLowerCase().includes(term);
    return unitOk && sessionOk && searchOk;
  });
}

function rebuildQuestions() {
  currentQuestions = shuf(filteredQuestions());
  currentIndex = 0;
  answered = false;
  correct = 0;
  wrong = 0;
  renderCurrentQuestion();
  renderStats();
}

function renderStats() {
  const total = currentQuestions.length;
  const remaining = Math.max(0, total - currentIndex - (answered ? 1 : 0));
  document.getElementById('totalQ').textContent = total;
  document.getElementById('correctQ').textContent = correct;
  document.getElementById('wrongQ').textContent = wrong;
  document.getElementById('remainQ').textContent = remaining;
  document.getElementById('progressFill').style.width = total ? (((currentIndex + (answered ? 1 : 0)) / total) * 100) + '%' : '0%';
  const attempts = correct + wrong;
  document.getElementById('scoreNum').textContent = attempts ? Math.round((correct / attempts) * 100) + '%' : '—';
}

function setMode(nextMode) {
  mode = nextMode;
  document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === nextMode));
  document.getElementById('statsStrip').classList.toggle('hidden', nextMode === 'notes');
  document.getElementById('quizView').classList.toggle('hidden', nextMode === 'review' || nextMode === 'notes');
  document.getElementById('reviewView').classList.toggle('hidden', nextMode !== 'review');
  document.getElementById('notesView').classList.toggle('hidden', nextMode !== 'notes');
  document.getElementById('endScreen').classList.add('hidden');
  if (nextMode === 'quiz') renderCurrentQuestion();
  if (nextMode === 'flash') renderFlashcard();
  if (nextMode === 'review') renderReview();
  if (nextMode === 'notes') renderNotes();
}

function renderCurrentQuestion() {
  if (mode !== 'quiz') return;
  const host = document.getElementById('questionHost');
  if (!currentQuestions.length) {
    host.innerHTML = `<div class="card"><div class="q">No hay preguntas para estos filtros.</div><div style="color:var(--muted)">Prueba cambiando unidad, sesión o búsqueda.</div></div>`;
    document.getElementById('nextBtn').classList.add('hidden');
    renderStats();
    return;
  }
  if (currentIndex >= currentQuestions.length) { showEnd(); return; }
  answered = false;
  document.getElementById('nextBtn').classList.add('hidden');
  const q = currentQuestions[currentIndex];
  host.innerHTML = `
    <div class="card">
      <div class="meta">
        <span class="badge a">P ${currentIndex + 1}/${currentQuestions.length}</span>
        <span class="badge b">${q.unit}</span>
        <span class="badge c">${q.session}</span>
        <span class="badge d">${q.label}</span>
      </div>
      <div class="q">${escapeHtml(q.q)}</div>
      <div class="opts">
        ${q.o.map((opt, i) => `<button class="opt" data-idx="${i}"><span class="l">${['A','B','C','D','E'][i] || String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></button>`).join('')}
      </div>
      <div class="fb" id="feedback"></div>
    </div>`;
  host.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => selectAnswer(Number(btn.dataset.idx))));
  renderStats();
}

function selectAnswer(choice) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIndex];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  const correctText = q.o[q.c];
  if (choice === q.c) {
    correct++;
    buttons[choice].classList.add('ok');
    fb.className = 'fb ok show';
    fb.innerHTML = `<div class="t">✓ Correcto</div><div class="b">${escapeHtml(q.e || 'Respuesta correcta.')}</div>`;
  } else {
    wrong++;
    buttons[choice].classList.add('no');
    if (buttons[q.c]) buttons[q.c].classList.add('ok');
    fb.className = 'fb no show';
    fb.innerHTML = `<div class="t">✗ Incorrecto — La correcta: "${escapeHtml(correctText)}"</div><div class="b">${escapeHtml(q.e || 'Revisa la explicación en las notas.')}</div>`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
  renderStats();
}

function nextQuestion() {
  currentIndex++;
  renderCurrentQuestion();
}

function skipQuestion() {
  if (!currentQuestions.length) return;
  const item = currentQuestions.splice(currentIndex, 1)[0];
  currentQuestions.push(item);
  renderCurrentQuestion();
}

function shuffleQuestions() {
  rebuildQuestions();
}

function showEnd() {
  document.getElementById('quizView').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  const total = correct + wrong;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  document.getElementById('endScore').textContent = `${correct}/${total}`;
  document.getElementById('endEmoji').textContent = pct >= 90 ? '🏆' : pct >= 70 ? '💪' : '📚';
  document.getElementById('endTitle').textContent = pct >= 90 ? '¡Excelente dominio!' : pct >= 70 ? '¡Buen trabajo!' : 'Sigue repasando';
  document.getElementById('endSub').textContent = `${unitLabels[unitFilter] || unitFilter} · ${sessionLabels[sessionFilter] || sessionFilter} · ${searchFilter ? 'Búsqueda activa' : 'Sin búsqueda'}`;
  document.getElementById('progressFill').style.width = '100%';
}

function restartQuiz() {
  currentQuestions = shuf(filteredQuestions());
  currentIndex = 0;
  answered = false;
  correct = 0;
  wrong = 0;
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('quizView').classList.remove('hidden');
  renderCurrentQuestion();
  renderStats();
}

let cardBack = false;
function renderFlashcard() {
  if (!FLASHCARDS.length) {
    document.getElementById('flashText').textContent = 'Sin tarjetas disponibles.';
    return;
  }
  const card = FLASHCARDS[cardIndex % FLASHCARDS.length];
  cardBack = false;
  document.getElementById('flashText').className = 'front';
  document.getElementById('flashText').textContent = card.front;
  document.getElementById('flipInfo').textContent = `${(cardIndex % FLASHCARDS.length) + 1} / ${FLASHCARDS.length}`;
}
function flipFlashcard() {
  if (!FLASHCARDS.length) return;
  const card = FLASHCARDS[cardIndex % FLASHCARDS.length];
  cardBack = !cardBack;
  if (cardBack) {
    document.getElementById('flashText').className = 'back';
    document.getElementById('flashText').innerHTML = escapeHtml(card.back).replace(/
/g, '<br>');
  } else {
    renderFlashcard();
  }
}
function nextCard() { cardIndex = (cardIndex + 1) % Math.max(FLASHCARDS.length, 1); renderFlashcard(); }
function prevCard() { cardIndex = (cardIndex - 1 + Math.max(FLASHCARDS.length, 1)) % Math.max(FLASHCARDS.length, 1); renderFlashcard(); }

function renderReview() {
  const el = document.getElementById('reviewView');
  el.innerHTML = currentQuestions.map((q, i) => `
    <div class="item">
      <div class="t1">P${i+1} · ${q.unit} · ${q.session} · ${q.label}</div>
      <div class="t2">${escapeHtml(q.q)}</div>
      ${q.o.map((o, j) => `<div style="padding:8px 10px;border-radius:8px;margin-bottom:6px;background:${j===q.c?'rgba(46,204,113,.1)':'var(--surface)'};border:1px solid ${j===q.c?'rgba(46,204,113,.35)':'var(--border)'};color:${j===q.c?'var(--green)':'var(--muted)'}"><strong style="font-family:var(--mono)">${['A','B','C','D','E'][j] || String.fromCharCode(65+j)}.</strong> ${escapeHtml(o)} ${j===q.c?'✓':''}</div>`).join('')}
      <div class="t3">${escapeHtml(q.e || '')}</div>
    </div>`).join('');
}

function renderNotes() {
  const el = document.getElementById('notesView');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div style="font-weight:800;font-size:18px;margin-bottom:10px">Resumen para estudio rápido</div>
    <div class="list">${FLASHCARDS.map(c => `
      <div class="item">
        <div class="t2">${escapeHtml(c.front)}</div>
        <div class="t3">${escapeHtml(c.back)}</div>
      </div>`).join('')}</div>`;
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

function buildFilterButtons() {
  const uWrap = document.getElementById('unitFilters');
  const sWrap = document.getElementById('sessionFilters');
  uWrap.innerHTML = ['all','U1','U2','U3','U4'].map(u => `<button class="pill${u==='all'?' active-pill':''}" data-unit="${u}">${unitLabels[u] || u}</button>`).join('');
  sWrap.innerHTML = ['all','T1S1','T1S2','T2S3','T2S4','U2T1','U2T2'].map(s => `<button class="chip${s==='all'?' active-chip':''}" data-session="${s}">${sessionLabels[s] || s}</button>`).join('');
  uWrap.querySelectorAll('[data-unit]').forEach(btn => btn.addEventListener('click', () => {
    unitFilter = btn.dataset.unit;
    uWrap.querySelectorAll('[data-unit]').forEach(b => b.classList.toggle('active-pill', b.dataset.unit === unitFilter));
    const allowed = sessionsByUnit[unitFilter] || ['all'];
    if (!allowed.includes(sessionFilter)) sessionFilter = 'all';
    sWrap.querySelectorAll('[data-session]').forEach(b => b.classList.toggle('active-chip', b.dataset.session === sessionFilter));
    rebuildQuestions();
  }));
  sWrap.querySelectorAll('[data-session]').forEach(btn => btn.addEventListener('click', () => {
    sessionFilter = btn.dataset.session;
    sWrap.querySelectorAll('[data-session]').forEach(b => b.classList.toggle('active-chip', b.dataset.session === sessionFilter));
    rebuildQuestions();
  }));
}

function hookEvents() {
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
  document.getElementById('skipBtn').addEventListener('click', skipQuestion);
  document.getElementById('shuffleBtn').addEventListener('click', shuffleQuestions);
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('restartBtn').addEventListener('click', restartQuiz);
  document.getElementById('flashcard').addEventListener('click', flipFlashcard);
  document.getElementById('prevCardBtn').addEventListener('click', prevCard);
  document.getElementById('nextCardBtn').addEventListener('click', nextCard);
  document.getElementById('searchBox').addEventListener('input', (e) => { searchFilter = e.target.value; rebuildQuestions(); });
}

buildFilterButtons();
hookEvents();
currentQuestions = shuf(filteredQuestions());
renderCurrentQuestion();
renderFlashcard();
renderStats();
renderReview();
</script>
